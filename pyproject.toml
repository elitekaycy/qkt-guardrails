[project]
name = "qkt-guardrails"
version = "0.1.0"
description = "An engine-independent equity watchdog for MT5 prop/live accounts."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["guardian"]
