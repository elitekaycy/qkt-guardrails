name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: python -m ruff check guardian tests
      - run: python -m mypy
      - run: python -m unittest discover -s tests -v
      - name: pyproject version and guardian.__version__ agree
        run: |
          set -euo pipefail
          py="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mod="$(python -c 'import guardian;print(guardian.__version__)')"
          [ "$py" = "$mod" ] || { echo "::error::pyproject $py != guardian.__version__ $mod"; exit 1; }

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qkt-guardrails:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot a fake gateway and verify the guardian polls it
        run: |
          set -euo pipefail
          python3 - <<'PYEOF' &
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(
                      {"data": {"equity": 9950.0}} if self.path == "/account" else {"kill_switch_active": False}
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  body = b'{"ok":true}'
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("0.0.0.0", 18421), H).serve_forever()
          PYEOF
          sleep 1

          cat > /tmp/ci-guardian.yaml <<'EOF'
          target:
            name: ci-smoke
            gateway_url: http://host.docker.internal:18421
            api_key: ${CI_TEST_KEY}
          account:
            initial_balance: 10000
          ladder:
            friday_flat: false   # the smoke asserts the no-op path whatever day CI runs
          poll:
            interval_seconds: 2
          EOF

          docker run -d --rm --name qkt-guardrails-ci \
            --add-host=host.docker.internal:host-gateway \
            -e CI_TEST_KEY=ci-token \
            -v /tmp/ci-guardian.yaml:/config/guardian.yaml:ro \
            qkt-guardrails:ci
          trap 'docker logs qkt-guardrails-ci || true; docker rm -f qkt-guardrails-ci >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            docker logs qkt-guardrails-ci 2>&1 | grep -q "guardian\[ci-smoke\] v[0-9.]* up" && break
            sleep 1
          done
          docker logs qkt-guardrails-ci 2>&1 | grep -q "guardian\[ci-smoke\] v[0-9.]* up"
          # give it a few poll cycles, then require: still running, no traceback, no loop
          # error (a loop error here means the image cannot write its own /state volume),
          # and no kill engaged against a healthy fake account.
          sleep 5
          docker inspect qkt-guardrails-ci --format '{{.State.Running}}' | grep -q true
          log="$(docker logs qkt-guardrails-ci 2>&1)"
          echo "$log"
          echo "$log" | grep -qi "traceback" && { echo "::error::traceback in guardian log"; exit 1; }
          echo "$log" | grep -q "loop error" && { echo "::error::loop error in guardian log"; exit 1; }
          echo "$log" | grep -q "KILL engaged" && { echo "::error::kill engaged on a healthy account"; exit 1; }
          echo "$log" | grep -q "BLIND" && { echo "::error::guardian went blind against the fake gateway"; exit 1; }
          true

  docker:
    needs: docker-smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the shipped version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          py="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$tag" = "$py" ] || { echo "::error::tag v$tag does not match pyproject version $py"; exit 1; }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The CHANGELOG section for this tag ("## vX.Y.Z — date" up to the next "## ").
          notes="$(awk -v v="## ${GITHUB_REF_NAME}" 'index($0, v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)"
          image="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          printf '%s\n\nImage: `%s`\n' "${notes:-see CHANGELOG.md}" "$image" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "qkt-guardrails $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
