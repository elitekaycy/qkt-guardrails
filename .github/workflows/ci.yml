name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: python -m ruff check guardian tests
      - run: python -m mypy
      - run: python -m unittest discover -s tests -v

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qkt-guardrails:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot a fake gateway and verify the guardian polls it
        run: |
          set -euo pipefail
          python3 - <<'PYEOF' &
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(
                      {"data": {"equity": 9950.0}} if self.path == "/account" else {"kill_switch_active": False}
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_POST(self):
                  body = b'{"ok":true}'
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("0.0.0.0", 18421), H).serve_forever()
          PYEOF
          sleep 1

          cat > /tmp/ci-guardian.yaml <<'EOF'
          target:
            name: ci-smoke
            gateway_url: http://host.docker.internal:18421
            api_key: ${CI_TEST_KEY}
          account:
            initial_balance: 10000
          poll:
            interval_seconds: 2
          EOF

          docker run -d --rm --name qkt-guardrails-ci \
            --add-host=host.docker.internal:host-gateway \
            -e CI_TEST_KEY=ci-token \
            -v /tmp/ci-guardian.yaml:/config/guardian.yaml:ro \
            qkt-guardrails:ci
          trap 'docker logs qkt-guardrails-ci || true; docker rm -f qkt-guardrails-ci >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            docker logs qkt-guardrails-ci 2>&1 | grep -q "guardian\[ci-smoke\] up" && break
            sleep 1
          done
          docker logs qkt-guardrails-ci 2>&1 | grep -q "guardian\[ci-smoke\] up"
          # give it a poll cycle, then require no crash/traceback in the log
          sleep 3
          docker inspect qkt-guardrails-ci --format '{{.State.Running}}' | grep -q true
          docker logs qkt-guardrails-ci 2>&1 | grep -qi "traceback" && exit 1 || true

  docker:
    needs: docker-smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
