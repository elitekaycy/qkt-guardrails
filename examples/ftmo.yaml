# FTMO preset: sized inside the firm's daily/total rules.
#
# Copy to configs/<account-name>.yaml and edit target/account below directly
# (they aren't secrets). The one field that stays out of the file is the API
# key — give it a var name unique to this account (so multiple accounts can
# share one .env without colliding) and set it there.
target:
  name: CHANGE_ME               # matches the qkt-insights instance_id, if any
  gateway_url: http://mt5-gateway:5001
  api_key: ${GUARDIAN_CHANGE_ME_API_KEY}

account:
  initial_balance: 20000

ladder:
  soft_pct: 2.5
  hard_pct: 3.5
  static_pct: 6
  roll_utc_hour: 22
  friday_flat: true
  fri_flat_utc: 20
  # Your venue's first tradable Sunday minute (UTC). The5ers reopens 22:10; Exness and
  # IC Markets ~22:05. A 24/7 (crypto) book sets friday_flat: false on its OWN account --
  # the kill switch is account-global and cannot spare some symbols.
  weekend_release_utc: "22:10"
  news_currencies: "USD,EUR"
  # news_include_holidays: false     # also open a window on a bank holiday for these currencies
  # news_timeout_seconds: 30         # feed fetch runs on a background thread, never the guard loop
  # news_refresh_steady_seconds: 21600
  # news_retry_seconds: 300          # after a FAILED fetch; keeps last-known windows meanwhile
  # Read event windows from a qkt-data-hub store instead of fetching the feed. This removes the
  # only outbound network call the brake makes: a hub already collecting that calendar on this
  # host holds the same records, and reading them needs nothing but the standard library. Mount
  # the store read-only -- the hub is its only writer.
  # news_hub_root: /var/lib/qkt-hub
  # news_hub_stale_after_seconds: 900  # past this the journal is not trusted and the cache KEEPS
  #                                    # its last windows, rather than reading "no release coming"

# Optional Telegram alerts on every engage/release — uncomment and set
# TG_TOKEN/TG_CHAT in .env if you want them; omit the whole section otherwise.
# notify:
#   telegram_token: ${TG_TOKEN}
#   telegram_chat: ${TG_CHAT}

